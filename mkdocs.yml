site_name: ML Engineer
site_description: Machine Learning Engineer Knowledge Vault & Notes
site_author: Devendra
site_url: https://devkumar70401.github.io/Notes/
repo_url: https://github.com/devkumar70401/Notes
repo_name: devkumar70401/Notes

hooks:
  - hooks/sync_docs.py

nav:
  - Home: index.md
  - 1. Languages:
    - Java:
      - Week 4:
        - Abstract Classes & Interfaces: 10_CS_&_Engineering/11_Languages/Java/week_4/01_abstract_classes_and_Interfaces.md
        - Interfaces: 10_CS_&_Engineering/11_Languages/Java/week_4/02_interfaces.md
        - Private Classes: 10_CS_&_Engineering/11_Languages/Java/week_4/03_private_classes.md
        - Controlled Interaction with Objects: 10_CS_&_Engineering/11_Languages/Java/week_4/04_controlled_interaction_with_objects.md
        - CallBacks: 10_CS_&_Engineering/11_Languages/Java/week_4/05_CallBacks.md
        - Iterators: 10_CS_&_Engineering/11_Languages/Java/week_4/06_Interators.md
    - Python:
      - Coming Soon: 10_CS_&_Engineering/11_Languages/Python/soon.md

validation:
  nav:
    omitted_files: info

theme:
  name: material
  language: en
  logo: assets/avatar.png
  favicon: assets/avatar.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Auto preference detection + Light / Dark toggle
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

plugins:
  - search
  - mkdocs-jupyter:
      include_source: True
      ignore:
        - "*scripts*"
        - "*.py"
        - ".venv/*"
        - ".git/*"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/devkumar70401
      name: GitHub Profile
    - icon: fontawesome/solid/paper-plane
      link: mailto:devkumar70401@gmail.com
      name: Email Devendra
